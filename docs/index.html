<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marshin Technologies</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol; margin: 0; padding: 0; line-height: 1.5; }
      .wrap { min-height: 100svh; display: grid; place-items: center; padding: 24px; }
      .card { max-width: 720px; width: 100%; border-radius: 16px; padding: 32px; box-shadow: 0 8px 30px rgba(0,0,0,.08); background: rgba(255,255,255,.9); backdrop-filter: blur(6px); }
      h1 { margin: 0 0 8px; font-weight: 700; font-size: 2rem; }
      p { margin: 0 0 16px; }
      .muted { opacity: .7; }
      footer { text-align: center; font-size: .9rem; opacity: .7; margin-top: 16px; }
      @media (prefers-color-scheme: dark) { .card { background: rgba(22,22,24,.8); color: #e6e6e6; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>Marshin Technologies</h1>
        <p class="muted">Website coming soon.</p>
        <p>Contact: <a href="mailto:hello@marshintechnologies.com">hello@marshintechnologies.com</a></p>
      </section>
      <footer>© <span id="y"></span> Marshin Technologies</footer>
    </main>
    <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
  </body>
</html>
